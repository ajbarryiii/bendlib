name: docs
on:
  push:
    branches: [main]
    paths: ["tools/docs/**", "tools/reader/**", "tools/mathlib/**", "toolchain.json", ".github/workflows/docs.yml"]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun tools/install-bend.ts
      - run: sudo apt-get install -y bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            tools/docs/.cache
            ~/.cache/bendlib
          key: docs-${{ hashFiles('toolchain.json') }}-${{ hashFiles('tools/docs/.cache/status.json') }}
          restore-keys: docs-${{ hashFiles('toolchain.json') }}-
      - name: status hash before build
        id: docs-status
        run: |
          h=absent
          [ -f tools/docs/.cache/status.json ] && h=$(sha256sum tools/docs/.cache/status.json | cut -d' ' -f1)
          echo "sha=$h" >> "$GITHUB_OUTPUT"
      - run: bun tools/docs/build.ts --jobs 4 --require-sandbox
      # Checks finished before a failure are kept: status.json is written as the build goes.
      - name: did the docs status change?
        id: docs-changed
        if: always() && steps.docs-status.outcome == 'success'
        run: |
          h=absent
          [ -f tools/docs/.cache/status.json ] && h=$(sha256sum tools/docs/.cache/status.json | cut -d' ' -f1)
          [ "$h" != absent ] && [ "$h" != "${{ steps.docs-status.outputs.sha }}" ] && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "yes=false" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always() && steps.docs-changed.outputs.yes == 'true'
        with:
          path: |
            tools/docs/.cache
            ~/.cache/bendlib
          key: docs-${{ hashFiles('toolchain.json') }}-${{ hashFiles('tools/docs/.cache/status.json') }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: tools/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
