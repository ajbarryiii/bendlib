name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun tools/install-bend.ts
      - run: sudo apt-get install -y bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/bendlib
          key: bendlib-${{ hashFiles('toolchain.json') }}
      - run: bun test tools/

  gates:
    runs-on: ubuntu-latest
    env:
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun tools/install-bend.ts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/bendlib
          key: bendlib-${{ hashFiles('toolchain.json') }}
      - run: bun tools/comments.ts
      - name: devlib pins are current
        run: bun tools/mathlib/devlib.ts --check
      - name: check mathlib against the local kernel (devlib)
        run: bun tools/mathlib/devlib.ts run -- bun tools/mathlib/check.ts packages/bend-mathlib
      - run: bun tools/mathlib/devlib.ts run -- bun tools/mathlib/lint.ts packages/bend-mathlib --erasure
      - run: bun tools/mathlib/twins.ts packages/bend-mathlib --check
      - name: check the kernel package (bend --check-only)
        run: bun tools/mathlib/check.ts packages/bendlib-kernel-list
      - name: lint the kernel package
        run: bun tools/mathlib/devlib.ts run -- bun tools/mathlib/lint.ts packages/bendlib-kernel-list --kernel --erasure
      - run: bun tools/mathlib/twins.ts packages/bendlib-kernel-list --check
      - run: bun tools/mathlib/lock.ts packages/bend-mathlib --check
      - name: lock trust anchor (published entries vs the newest bend-mathlib tag)
        run: |
          tag=$(git describe --tags --match 'bend-mathlib-v*' --abbrev=0 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "no bend-mathlib-v* tag yet; skipping --against"
          else
            bun tools/mathlib/lock.ts packages/bend-mathlib --check --against "$tag"
          fi
      - name: index check (version from RELEASES.md)
        run: |
          v=$(awk -F'|' '/bend-mathlib/{v=$3} END{gsub(/ /,"",v);print v}' RELEASES.md)
          bun tools/mathlib/index.ts packages/bend-mathlib bend-mathlib "$v" --check

  modules:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.ls.outputs.list }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: ls
        run: echo "list=$(for f in packages/bend-mathlib/*.bend; do basename "$f" .bend; done | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  lawcheck:
    needs: modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.list) }}
    env:
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun tools/install-bend.ts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/bendlib
          key: bendlib-${{ hashFiles('toolchain.json') }}
      - name: devlib pins are current
        run: bun tools/mathlib/devlib.ts --check
      - name: lawcheck stamp ${{ matrix.module }} (lookup)
        id: stamp
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lawcheck-stamp
          key: lawcheck-${{ matrix.module }}-${{ hashFiles('packages/**','tools/lawcheck/**','tools/reader/**','tools/mathlib/**','toolchain.json','.github/workflows/ci.yml') }}
          lookup-only: true
      - name: lawcheck ${{ matrix.module }}
        if: steps.stamp.outputs.cache-hit != 'true'
        run: bun tools/mathlib/devlib.ts run -- bun tools/lawcheck/cli.ts packages/bend-mathlib/${{ matrix.module }}.bend --max-instances 100 --strict --allow-skip cong2,eq_true_of_ne_false,foldl_eq_foldr,foldl_eq_foldr_sym,foldl_op_eq_foldr_op,foldl_op_eq_foldr_op_sym,le_antisymm_eq,le_total,le_total_d,le_total_of_not_le,le_total_true,le_total_true_sym,le_trans3,le_trans4,maybe_bind_assoc,maybe_bind_assoc_sym,maybe_bind_map,maybe_bind_map_sym,maybe_map_bind,maybe_map_bind_sym,maybe_map_compose,maybe_map_compose_sym,maybe_map_pure,maybe_map_pure_sym,maybe_pure_bind,maybe_pure_bind_sym,op_assoc4,op_assoc4_sym,op_comm3,op_comm3_sym,op_four,op_four_sym,op_left_comm,op_left_comm_sym,op_right_comm,op_right_comm_sym,sorted_append,subst
      - name: stamp lawcheck ${{ matrix.module }}
        if: steps.stamp.outputs.cache-hit != 'true'
        run: touch .lawcheck-stamp
      - name: save lawcheck stamp ${{ matrix.module }}
        if: steps.stamp.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lawcheck-stamp
          key: lawcheck-${{ matrix.module }}-${{ hashFiles('packages/**','tools/lawcheck/**','tools/reader/**','tools/mathlib/**','toolchain.json','.github/workflows/ci.yml') }}

  verdict:
    # bend --verdict re-checks every def in BendTT, the kernel whose soundness is proved in Lean.
    runs-on: ubuntu-latest
    env:
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun tools/install-bend.ts
      - name: Lean v4.34.0 (bend --verdict builds its kernel with it)
        run: |
          curl -fsSL -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: the proven kernel accepts every module
        run: |
          verdict() { bun tools/mathlib/devlib.ts run -- "$HOME/.bend/bin/bend" "$1" --verdict 2>&1; }
          for f in packages/bendlib-kernel-list/list.bend packages/bend-mathlib/*.bend; do
            out=$(verdict "$f") && [ "$out" = "ALL PROOFS CHECK" ] || { echo "$f: $out"; exit 1; }
            echo "ok $f"
          done

  latest-compiler:
    # Early warning only: the newest Bend release against our sources.
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: install the newest bend release
        run: |
          curl -fsSL -o install.sh https://bend-lang.com/install.sh
          sh install.sh
          $HOME/.bend/bin/bend version
      - name: pin toolchain.json to the installed release
        run: |
          v=$($HOME/.bend/bin/bend version | cut -d' ' -f2)
          # Move the pin to the release under test. The reader enforces the source pin
          # only for the pinned version, so fetch + hash that release: the pin tests
          # then verify the newest source instead of having no pin to assert against.
          jq --arg v "$v" '.bend.version = $v | del(.bend.source)' toolchain.json > toolchain.tmp && mv toolchain.tmp toolchain.json
          bun tools/reader/cli.ts --pin > "${RUNNER_TEMP:-/tmp}/pin.json"
          jq --slurpfile p "${RUNNER_TEMP:-/tmp}/pin.json" '.bend.source = $p[0]' toolchain.json > toolchain.tmp && mv toolchain.tmp toolchain.json
      - name: devlib pins are current
        run: bun tools/mathlib/devlib.ts --check
      - run: bun tools/mathlib/devlib.ts run -- bun tools/mathlib/check.ts packages/bend-mathlib
      - run: bun test tools/reader tools/lawcheck
      - run: bun tools/lawcheck/cli.ts packages/bend-mathlib/nat.bend --max-instances 50 --strict --allow-skip cong2,eq_true_of_ne_false,foldl_eq_foldr,foldl_eq_foldr_sym,foldl_op_eq_foldr_op,foldl_op_eq_foldr_op_sym,le_antisymm_eq,le_total,le_total_d,le_total_of_not_le,le_total_true,le_total_true_sym,le_trans3,le_trans4,maybe_bind_assoc,maybe_bind_assoc_sym,maybe_bind_map,maybe_bind_map_sym,maybe_map_bind,maybe_map_bind_sym,maybe_map_compose,maybe_map_compose_sym,maybe_map_pure,maybe_map_pure_sym,maybe_pure_bind,maybe_pure_bind_sym,op_assoc4,op_assoc4_sym,op_comm3,op_comm3_sym,op_four,op_four_sym,op_left_comm,op_left_comm_sym,op_right_comm,op_right_comm_sym,sorted_append,subst
      - name: F-fact regression (research/experiments/run.sh)
        run: bash research/experiments/run.sh
      - name: open or update the nightly failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          v=$($HOME/.bend/bin/bend version 2>/dev/null | cut -d' ' -f2)
          t="nightly: bend ${v:-(install failed)} breaks bendlib"
          n=$(gh issue list --state open --search "in:title \"$t\"" --json number --jq '.[0].number')
          if [ -n "$n" ] && [ "$n" != "null" ]; then
            gh issue comment "$n" --body "$RUN_URL"
          else
            gh issue create --title "$t" --body "$RUN_URL"
          fi
